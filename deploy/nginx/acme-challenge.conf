# Shared ACME HTTP-01 challenge location, included by every domain's :80 server block so
# Certbot's `--webroot -w /var/www/certbot` can complete/renew for all four domains through
# one shared webroot directory (see deploy/RUNBOOK.md "HTTPS via Let's Encrypt"). Must stay
# plain HTTP and outside any auth/redirect — Let's Encrypt's validator requests it over :80.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
}
