# aryanb.dev — static portfolio site. Root points at the release published by
# deploy/publish.sh (deploy/sites/aryanb.dev/* copied verbatim, with {{...}} placeholders
# substituted — see publish.sh).

server {
    listen 80;
    listen [::]:80;
    server_name aryanb.dev www.aryanb.dev;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://aryanb.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aryanb.dev;

    ssl_certificate     /etc/letsencrypt/live/aryanb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aryanb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    return 301 https://aryanb.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aryanb.dev;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/security-headers-static.conf;

    ssl_certificate     /etc/letsencrypt/live/aryanb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aryanb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    access_log /var/log/nginx/aryanb.dev.access.log;
    error_log  /var/log/nginx/aryanb.dev.error.log;

    root /var/www/aryanb.dev/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /resume.pdf {
        try_files $uri =404;
        add_header Content-Disposition 'inline; filename="Aryan-Bhandary-Resume.pdf"';
    }
}
