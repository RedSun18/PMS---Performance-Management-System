# Cloudflare real-IP snippet — included by every server block (see each *.conf's
# `include /etc/nginx/snippets/cloudflare-realip.conf;`).
#
# All four domains are proxied ("orange-clouded") through Cloudflare, so without this,
# every request Nginx (and therefore Kestrel, via X-Forwarded-For) sees would come from a
# Cloudflare edge IP instead of the real visitor — breaking audit-log IP capture
# (PmForm/WorkflowAdmin "who did this from where") and rate-limiting/Fail2Ban accuracy.
#
# ngx_http_realip_module ships with Ubuntu's nginx package (no extra install needed).
# Regenerate this list from https://www.cloudflare.com/ips/ if Cloudflare changes their
# ranges (rare, but the RUNBOOK links a one-line refresh command).

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
