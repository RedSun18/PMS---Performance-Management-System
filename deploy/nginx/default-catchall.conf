# Safety net, not a substitute for each real domain having its own valid certificate and
# server block installed: explicitly refuses any HTTPS request whose SNI/Host doesn't match
# one of the four real per-domain server blocks, instead of silently falling back to
# whichever real domain's config Nginx happens to load first (alphabetically) for port 443.
#
# This is exactly how aryanb.dev ended up serving docs.aryanb.dev's content in production —
# aryanb.dev's certificate was never issued, so its real 443 server block was never
# installed, and Nginx silently used docs.aryanb.dev's block (the next one in load order) as
# the de facto default for ANY unmatched Host header, including "aryanb.dev". With this
# catch-all in place, the same underlying gap (a missing certificate) instead produces a
# closed connection for the affected domain — an honest, visible failure instead of quietly
# serving a different site's branded content under the wrong name.
#
# `ssl_reject_handshake` (Nginx 1.19.4+) rejects the TLS handshake itself before a
# certificate would even need to be selected, so this catch-all needs no cert/key of its own
# and can never conflict with the per-domain bootstrap-vs-final-config lifecycle above.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
