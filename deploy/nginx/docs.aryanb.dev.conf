# docs.aryanb.dev — static documentation bundle (deploy/sites/docs.aryanb.dev/* + a copy of
# docs/demo/* from the main repo — see publish.sh). Directory listing enabled for the
# screenshots folder so individual images are browsable without a bespoke gallery page.

server {
    listen 80;
    listen [::]:80;
    server_name docs.aryanb.dev;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.aryanb.dev;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/security-headers-static.conf;

    ssl_certificate     /etc/letsencrypt/live/docs.aryanb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.aryanb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    access_log /var/log/nginx/docs.aryanb.dev.access.log;
    error_log  /var/log/nginx/docs.aryanb.dev.error.log;

    root /var/www/docs.aryanb.dev/current;
    index index.html;

    location /screenshots/ {
        autoindex on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
