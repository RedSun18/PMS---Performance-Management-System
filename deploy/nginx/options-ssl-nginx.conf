# Certbot's standard Nginx SSL baseline (TLSv1.2/1.3, modern cipher list, session cache) —
# installed to /etc/letsencrypt/options-ssl-nginx.conf by deploy/bootstrap-server.sh, only if
# nothing is there yet (never overwrites a real Certbot-managed copy).
#
# Normally Certbot's nginx *plugin* drops this file itself as a side effect of running
# `certbot --nginx`; this deployment deliberately uses `certbot certonly --webroot` instead
# (so Certbot never rewrites our git-tracked Nginx configs), so that side effect never
# happens — see the comment in bootstrap-server.sh step 11. This is a checked-in copy of the
# same well-known, publicly documented content Certbot itself ships, kept here so a fresh
# deploy doesn't depend on guessing paths inside the certbot-nginx Python package.

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
