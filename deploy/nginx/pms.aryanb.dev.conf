# pms.aryanb.dev — reverse proxy to the PMS Demo app (Kestrel, systemd unit
# deploy/systemd/pms-demo.service, bound to 127.0.0.1:8090 only — never exposed directly).
#
# Installed by deploy/bootstrap-server.sh AFTER certificates exist (see deploy/RUNBOOK.md);
# until then a temporary HTTP-only bootstrap config is used so Certbot's HTTP-01 challenge
# has something to answer on :80. Symlink this file from /etc/nginx/sites-available into
# sites-enabled once /etc/letsencrypt/live/pms.aryanb.dev/ exists.

server {
    listen 80;
    listen [::]:80;
    server_name pms.aryanb.dev;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pms.aryanb.dev;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/pms.aryanb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pms.aryanb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    access_log /var/log/nginx/pms.aryanb.dev.access.log;
    error_log  /var/log/nginx/pms.aryanb.dev.error.log;

    # Branding logo uploads (Settings > Branding) — default 1m is too small for some logo
    # files; the app itself doesn't impose a separate limit, so this is the real ceiling.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Program.cs's ForwardedHeadersOptions trusts whatever it's given (KnownProxies
        # cleared, by design — see the comment there) because Kestrel is only reachable via
        # this loopback proxy, never directly from the internet. cloudflare-realip.conf above
        # has already rewritten $remote_addr to the real visitor IP from CF-Connecting-IP, so
        # X-Forwarded-For here carries the real client, not Cloudflare's edge IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # PDF export (PuppeteerSharp/Chromium) and large report queries can run well past
        # Nginx's 60s default; the app's own DB command timeout is 60s per query but a report
        # can issue several, plus render time.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
