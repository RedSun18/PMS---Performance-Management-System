# renewalflow.aryanb.dev — static "Coming Soon" page (deploy/sites/renewalflow.aryanb.dev/*).

server {
    listen 80;
    listen [::]:80;
    server_name renewalflow.aryanb.dev;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name renewalflow.aryanb.dev;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/security-headers-static.conf;

    ssl_certificate     /etc/letsencrypt/live/renewalflow.aryanb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renewalflow.aryanb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    access_log /var/log/nginx/renewalflow.aryanb.dev.access.log;
    error_log  /var/log/nginx/renewalflow.aryanb.dev.error.log;

    root /var/www/renewalflow.aryanb.dev/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
