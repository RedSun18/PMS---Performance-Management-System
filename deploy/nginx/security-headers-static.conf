# Security headers for the three plain-static sites (aryanb.dev, docs.aryanb.dev,
# renewalflow.aryanb.dev). pms.aryanb.dev does NOT include this — the app itself already
# sets its own equivalent (and stricter) headers in Program.cs; duplicating them at the
# Nginx layer there would just risk the two copies drifting out of sync.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 'unsafe-inline' on both style and script: all three sites use a small inline <style>
# block AND a small inline <script> block (mobile menu toggle, scroll-reveal
# IntersectionObserver, tilt/glow effects, the RenewalFlow waitlist form, aryanb.dev's
# JS-populated tech-stack grid) — no external CSS/JS. Without 'unsafe-inline' on
# script-src, the browser silently drops every one of those inline scripts (a CSP
# violation, not a JS error, so it's invisible without opening devtools): the waitlist
# form stops submitting, scroll-reveal sections never animate in, and aryanb.dev's tech
# stack section renders completely empty. script-src also allows Cloudflare Web
# Analytics' beacon host for when CF_BEACON_TOKEN is configured (see RUNBOOK
# "Analytics") — harmless if unused.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
