# journald drop-in capping log growth for the pms-demo unit's console output (the app logs
# to stdout only — no file-based app logging — so journald retention IS the app's log
# rotation; see deploy/logrotate/nginx-pms for the Nginx side).
#
# Install: sudo mkdir -p /etc/systemd/journald.conf.d
#          sudo cp deploy/systemd/journald-pms-demo.conf /etc/systemd/journald.conf.d/pms-demo.conf
#          sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=500M
MaxRetentionSec=30day
